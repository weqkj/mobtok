name: MobtokPatcher
options:
  bundleIdPrefix: dev.mobtok
  deploymentTarget: { iOS: "15.0" }
packages:
  ZIPFoundation: { url: https://github.com/weichsel/ZIPFoundation, from: "0.9.19" }
targets:
  MobtokPatcher:
    type: application
    platform: iOS
    sources: [MobtokPatcher]
    dependencies: [{ package: ZIPFoundation }]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.mobtok.patcher
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_CFBundleDisplayName: mobtok
      INFOPLIST_KEY_UISupportsDocumentBrowser: YES
      INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
      GENERATE_INFOPLIST_FILE: YES
